{% extends 'ET/Base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="page-title">Delete Budget</h2>

    <div class="alert alert-danger">
        <h5>Are you sure you want to delete this budget?</h5>
    </div>

    <table class="table table-bordered">

        <tr>
            <th>Category</th>
            <td>{{ budget.category.name }}</td>
        </tr>

        <tr>
            <th>Budget Amount</th>
            <td>{{ budget.amount }}</td>
        </tr>

        <tr>
            <th>Month</th>
            <td>{{ budget.month }}</td>
        </tr>

        <tr>
            <th>Year</th>
            <td>{{ budget.year }}</td>
        </tr>

    </table>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Delete Budget
        </button>

        <a href="{% url 'budget_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
